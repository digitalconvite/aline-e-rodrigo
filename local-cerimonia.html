<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local da Cerimônia - Aline e Rodrigo</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Ícones do App/Navegador -->
  <link href="imagens/icon.png" rel="shortcut icon"/>
  <link href="imagens/icon-192.png" rel="icon" sizes="192x192"/>
  <link href="imagens/icon-180.png" rel="apple-touch-icon" sizes="180x180"/>
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Estilos da página -->
  <style>
    :root {
      --bg-color: #FFFFFF;
      --bg-outer: #EAEAEA;
      --primary-gold: #C5A059;
      --primary-gold-dark: #A4813D;
      --text-dark: #4A4A4A;
      --text-muted: #777777;
      --border-color: #BDBDBD;
      --font-serif: 'Cinzel', serif;
      --font-sans: 'Montserrat', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-outer);
      font-family: var(--font-sans);
      color: var(--text-dark);
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Container idêntico ao do Convite Principal */
    .card-container {
      width: 100%;
      max-width: 520px;
      background-color: var(--bg-color);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      min-height: 100vh;
      padding: 30px 20px;
    }

    /* Ícone no topo */
    .icon-header {
      width: 55px;
      height: 55px;
      background-color: var(--primary-gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 1.4rem;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(197, 160, 89, 0.3);
    }

    /* Título com a fonte Cinzel e Dourado oficial */
    .title {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      font-weight: 500;
      color: var(--primary-gold);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-dark);
      letter-spacing: 1px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .divider-line {
      width: 60%;
      height: 1px;
      background-color: var(--border-color);
      margin: 0 auto 20px auto;
    }

    /* Moldura do Mapa */
    .map-frame {
      width: 100%;
      height: 380px;
      border: 1px solid var(--primary-gold);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      margin-bottom: 25px;
    }

    .map-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Botão de Voltar com o estilo dos botões principais */
    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: var(--primary-gold);
      color: #FFFFFF;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 4px;
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(197, 160, 89, 0.3);
      transition: background-color 0.2s ease, transform 0.2s ease;
      margin-top: auto;
    }

    .back-btn:hover {
      background-color: var(--primary-gold-dark);
      transform: translateY(-2px);
    }

    /* Adaptação Mobile */
    @media screen and (max-width: 600px) {
      .card-container {
        padding: 25px 15px;
      }
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- ÍCONE DO TOPO -->
    <div class="icon-header">
      <i class="fas fa-church"></i>
    </div>

    <!-- TÍTULO DA PÁGINA -->
    <h1 class="title">Local da Cerimônia</h1>
    <p class="subtitle">Arautos do Evangelho</p>

    <div class="divider-line"></div>

    <!-- MAPA INCORPORADO DO GOOGLE MAPS -->
    <div class="map-frame">
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3655.479996859861!2d-46.875242223723426!3d-23.622975263860475!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94cfaa419c876f05%3A0x60f37e80e1690f60!2sBas%C3%ADlica%20Nossa%20Senhora%20do%20Ros%C3%A1rio%20de%20F%C3%A1tima!5e0!3m2!1spt-BR!2sbr!4v1790865961274!5m2!1spt-BR!2sbr" 
        width="600" 
        height="450" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>

    <!-- BOTÃO PARA VOLTAR AO CONVITE -->
    <a href="./index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i>
      Voltar ao Convite
    </a>
  </div>

</body>
</html>
